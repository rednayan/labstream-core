[package]
name = "lsl-capi"
version.workspace = true
description = "The C ABI of LSL. The only crate here that holds raw pointers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lsl"
# A C application loads this by file name, so the output has to be a shared
# library named `liblsl.so`.
crate-type = ["cdylib"]

[dependencies]
lsl-wire = { path = "../lsl-wire" }
lsl-net = { path = "../lsl-net" }
lsl-time = { path = "../lsl-time" }
libc = "0.2"
