[package]
name = "labstream-capi"
version.workspace = true
description = "The C ABI of LSL. The only crate here that holds raw pointers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lsl"
# A C application loads this by file name, so the output has to be a shared
# library named `liblsl.so`.
crate-type = ["cdylib"]

[dependencies]
labstream-wire = { path = "../labstream-wire" }
labstream-net = { path = "../labstream-net" }
labstream-time = { path = "../labstream-time" }
libc = "0.2"
