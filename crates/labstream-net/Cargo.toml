[package]
name = "labstream-net"
version.workspace = true
description = "Sockets, timers, and interfaces for LSL. The only crate here that touches the operating system."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
labstream-wire = { path = "../labstream-wire" }
labstream-proto = { path = "../labstream-proto" }
labstream-time = { path = "../labstream-time" }
# Only for one socket option that the standard library does not expose.
# `src/udp_server.cpp:60` sets it, and a second outlet needs it.
socket2 = "0.5"

# Only for `clock_gettime`, which gives the clock that liblsl reads. Windows
# has no such function. `clock()` reads the performance counter there, through
# a declaration in `src/lib.rs`, and needs no crate for it.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
