[package]
name = "lsl-net"
version.workspace = true
description = "Sockets, timers, and interfaces for LSL. The only crate here that touches the operating system."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lsl-wire = { path = "../lsl-wire" }
lsl-proto = { path = "../lsl-proto" }
lsl-time = { path = "../lsl-time" }
libc = "0.2.189"
# Only for one socket option that the standard library does not expose.
# `src/udp_server.cpp:60` sets it, and a second outlet needs it.
socket2 = "0.5"
